syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.greenhouse.grpc.greenhouse";
option java_outer_classname = "GreenhouseProto";

service GreenhouseService {
  rpc GetThresholds (GreenhouseThresholdRequest) returns (GreenhouseThresholdResponse);
  rpc GetGreenhouseOwner (GreenhouseOwnerRequest) returns (GreenhouseOwnerResponse);


  rpc DeleteGreenhousesByOwner (DeleteGreenhousesByOwnerRequest) returns (DeleteGreenhousesByOwnerResponse);

  rpc GetGreenhousesByOwner (GreenhousesByOwnerRequest) returns (GreenhousesByOwnerResponse);
}

// Service definition
service GreenhouseValidationService {
  // A method that receives an ID and returns a confirmation.
  rpc ValidateGreenhouse (GreenhouseRequest) returns (GreenhouseResponse);
}

// Input DTO (Request)
message GreenhouseRequest {
  int64 greenhouseId = 1;
}

// Output DTO (Response)
message GreenhouseResponse {
  bool exists = 1;
}

message GreenhouseThresholdRequest { int64 greenhouseId = 1; }
message GreenhouseThresholdResponse { float triggerTemperature = 1; float triggerHumidity = 2; }
message GreenhouseOwnerRequest { int64 greenhouseId = 1; }
message GreenhouseOwnerResponse { int64 ownerId = 1; }

message DeleteGreenhousesByOwnerRequest { int64 ownerId = 1; }
message DeleteGreenhousesByOwnerResponse { int32 deletedCount = 1; }

message GreenhousesByOwnerRequest { int64 ownerId = 1; }
message GreenhousesByOwnerResponse { repeated int64 greenhouseIds = 1; }